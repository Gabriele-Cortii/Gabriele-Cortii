<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Code on one side, design on the other" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0518"/>
      <stop offset="0.5" stop-color="#1B0938"/>
      <stop offset="1" stop-color="#0B0518"/>
    </linearGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="210">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E879F9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shapeFill" gradientUnits="userSpaceOnUse" x1="760" y1="40" x2="1100" y2="180">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A855F7" fill-opacity="0.16"/>
    </pattern>
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sframe"><rect width="1200" height="210" rx="14"/></clipPath>
    <clipPath id="l1"><rect x="60" y="60" width="270" height="26"><animate attributeName="width" values="0;250" dur="1.1s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="60" y="96" width="500" height="26"><animate attributeName="width" values="0;470" dur="1.7s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="60" y="132" width="330" height="26"><animate attributeName="width" values="0;300" dur="1.2s" begin="3.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#sframe)">
    <rect width="1200" height="210" fill="url(#sbg)"/>
    <rect x="600" width="600" height="210" fill="url(#dots)"/>

    <!-- LEFT: code typing itself -->
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19">
      <g clip-path="url(#l1)">
        <text x="60" y="79" fill="#C084FC">def <tspan fill="#F5F3FF">ship</tspan><tspan fill="#C4B5FD">(idea):</tspan></text>
      </g>
      <g clip-path="url(#l2)">
        <text x="90" y="115" fill="#C084FC">return <tspan fill="#F5F3FF">build</tspan><tspan fill="#C4B5FD">(idea)</tspan> + <tspan fill="#F5F3FF">design</tspan><tspan fill="#C4B5FD">(idea)</tspan></text>
      </g>
      <g clip-path="url(#l3)">
        <text x="60" y="151" fill="#6D28D9"># due metà, uno schermo</text>
      </g>
      <rect y="131" width="9" height="24" fill="#E879F9" x="390">
        <animate attributeName="x" values="60;330" dur="1.1s" begin="0.3s" fill="freeze"/>
        <animate attributeName="y" values="59;95" dur="0.01s" begin="1.45s" fill="freeze"/>
        <animate attributeName="x" values="90;560" dur="1.7s" begin="1.5s" fill="freeze"/>
        <animate attributeName="y" values="95;131" dur="0.01s" begin="3.35s" fill="freeze"/>
        <animate attributeName="x" values="60;390" dur="1.2s" begin="3.4s" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- RIGHT: a shape drawing itself -->
    <g transform="translate(0 0)">
      <path d="M740 168 C790 30 900 210 1010 74 C1058 16 1108 60 1130 112" fill="none" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="0" filter="url(#sglow)">
        <animate attributeName="stroke-dashoffset" values="720;0" dur="3.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </path>
      <path d="M740 168 C790 30 900 210 1010 74 C1058 16 1108 60 1130 112 L1130 215 L740 215 Z" fill="url(#shapeFill)" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="1.4s" begin="3.6s" fill="freeze"/>
      </path>

      <!-- handles -->
      <g stroke="#C084FC" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 4">
        <line x1="740" y1="168" x2="790" y2="30" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.9s" fill="freeze"/></line>
        <line x1="1010" y1="74" x2="1058" y2="16" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.1s" fill="freeze"/></line>
      </g>

      <!-- nodes -->
      <g fill="#0B0518" stroke="#E879F9" stroke-width="3">
        <rect x="733" y="161" width="14" height="14" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/></rect>
        <rect x="1003" y="67" width="14" height="14" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/></rect>
        <rect x="1123" y="105" width="14" height="14" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.7s" fill="freeze"/></rect>
      </g>
      <g fill="#C084FC">
        <circle cx="790" cy="30" r="4" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.95s" fill="freeze"/></circle>
        <circle cx="1058" cy="16" r="4" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.15s" fill="freeze"/></circle>
      </g>
    </g>

    <!-- CENTER seam -->
    <rect x="599" y="0" width="2" height="210" fill="url(#seam)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" r="5" fill="#F5F3FF" filter="url(#sglow)">
      <animate attributeName="cy" values="-10;220;-10" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
  </g>
</svg>
