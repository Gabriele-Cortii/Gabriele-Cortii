<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Gabriele Corti - I write the code and I design how it looks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0416"/>
      <stop offset="0.45" stop-color="#1C0A3E"/>
      <stop offset="1" stop-color="#090313"/>
    </linearGradient>

    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0" spreadMethod="repeat">
      <stop offset="0.00" stop-color="#8B5CF6"/>
      <stop offset="0.35" stop-color="#DDD6FE"/>
      <stop offset="0.50" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#DDD6FE"/>
      <stop offset="1.00" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-620 0" to="620 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.6" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#E9D5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9D5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E9D5FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A855F7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="0"/>
    </clipPath>

    <clipPath id="typeReveal">
      <rect x="72" y="196" width="560" height="34">
        <animate attributeName="width" values="0;0;560" keyTimes="0;0.22;1" dur="3.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- slow drifting light -->
    <g filter="url(#soft)">
      <circle r="190" fill="url(#blobA)">
        <animate attributeName="cx" values="180;520;180" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;250;90" dur="23s" repeatCount="indefinite"/>
      </circle>
      <circle r="210" fill="url(#blobB)">
        <animate attributeName="cx" values="1020;760;1020" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;60;240" dur="17s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- rising sparks -->
    <g fill="#DDD6FE">
      <circle cx="120" cy="320" r="1.8"><animate attributeName="cy" values="330;-10" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="265" cy="320" r="1.3"><animate attributeName="cy" values="330;-10" dur="11s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="320" r="2.1"><animate attributeName="cy" values="330;-10" dur="13s" begin="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="320" r="1.5"><animate attributeName="cy" values="330;-10" dur="10s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.65;0" dur="10s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="320" r="1.9"><animate attributeName="cy" values="330;-10" dur="12s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="12s" begin="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="320" r="1.2"><animate attributeName="cy" values="330;-10" dur="14s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="320" r="2.0"><animate attributeName="cy" values="330;-10" dur="10.5s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10.5s" begin="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="320" r="1.6"><animate attributeName="cy" values="330;-10" dur="12.5s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12.5s" begin="1.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- right-hand mark: code brackets + vector node, the two halves of the job -->
    <g transform="translate(1010 160)" opacity="1">
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1.5s" fill="freeze"/>
      <g fill="none" stroke="#A855F7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M-96 -46 L-136 0 L-96 46">
          <animateTransform attributeName="transform" type="translate" values="0 0;-7 0;0 0" dur="3.6s" repeatCount="indefinite"/>
        </path>
        <path d="M96 -46 L136 0 L96 46">
          <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="3.6s" repeatCount="indefinite"/>
        </path>
      </g>
      <path d="M-70 40 C-30 -70 40 90 78 -34" fill="none" stroke="#E9D5FF" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="300;0" dur="2.6s" begin="1.8s" fill="freeze"/>
      </path>
      <g fill="#0A0416" stroke="#C084FC" stroke-width="3">
        <rect x="-77" y="33" width="14" height="14" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/></rect>
        <rect x="71" y="-41" width="14" height="14" opacity="1"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.1s" fill="freeze"/></rect>
      </g>
      <circle cx="4" cy="14" r="5" fill="#F5F3FF" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <text x="70" y="150" font-family="'Segoe UI Semibold','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-1.5" fill="url(#shine)">Gabriele Corti</text>

    <!-- growing rule -->
    <rect x="72" y="170" height="4" rx="2" width="568" fill="url(#rule)">
      <animate attributeName="width" values="0;568" dur="1.5s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>

    <!-- subtitle, typed -->
    <g clip-path="url(#typeReveal)">
      <text x="72" y="221" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#C4B5FD">I write the code and I design how it looks</text>
    </g>
    <rect y="199" width="10" height="24" fill="#E879F9" x="632">
      <animate attributeName="x" values="72;72;632" keyTimes="0;0.22;1" dur="3.4s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0 0.2 1"/>
      <animate attributeName="opacity" values="1;1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- footer tags -->
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">
      <g opacity="1"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.6s" fill="freeze"/>
        <rect x="70" y="252" width="150" height="30" rx="15" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.5"/>
        <text x="88" y="272" fill="#DDD6FE">Python · C · Java</text>
      </g>
      <g opacity="1"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="2.85s" fill="freeze"/>
        <rect x="232" y="252" width="212" height="30" rx="15" fill="#C026D3" fill-opacity="0.14" stroke="#C026D3" stroke-opacity="0.5"/>
        <text x="250" y="272" fill="#F5D0FE">Illustrator · Photoshop</text>
      </g>
      <g opacity="1"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="3.1s" fill="freeze"/>
        <rect x="456" y="252" width="132" height="30" rx="15" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.5"/>
        <text x="474" y="272" fill="#C4B5FD">Lecco, Italy</text>
      </g>
    </g>

    <!-- one slow light sweep across the whole banner -->
    <rect x="-200" y="-40" width="180" height="400" fill="url(#sweep)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1320" dur="7s" begin="1s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="316" width="1200" height="4" fill="url(#rule)" opacity="0.8"/>
  </g>
</svg>
