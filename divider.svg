<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7C3AED" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#C026D3" stop-opacity="0.95"/>
      <stop offset="0.75" stop-color="#7C3AED" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.35" stop-color="#E879F9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="6" width="1000" height="2" fill="url(#base)"/>

  <g>
    <ellipse cy="7" rx="70" ry="7" fill="url(#dot)">
      <animate attributeName="cx" values="-80;1080" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </ellipse>
    <circle cy="7" r="2.6" fill="#FFFFFF">
      <animate attributeName="cx" values="-80;1080" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
  </g>
</svg>
